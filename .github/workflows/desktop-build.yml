name: Native Desktop Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check project readiness
        id: project
        shell: bash
        run: |
          if [[ -f package.json && -f pnpm-lock.yaml && -f src-tauri/tauri.conf.json ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::pnpm project, lockfile, and Tauri config are required for native build; skipping until configured.'
            echo 'Native builds: NOT CONFIGURED.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.project.outputs.ready == 'true'
        with: { node-version: 24 }
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux' && steps.project.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - name: Install pnpm
        if: steps.project.outputs.ready == 'true'
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate
      - run: pnpm install --frozen-lockfile
        if: steps.project.outputs.ready == 'true'
      - name: Build target-native packages
        if: steps.project.outputs.ready == 'true'
        run: pnpm tauri build
