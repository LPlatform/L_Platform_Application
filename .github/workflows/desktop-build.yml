name: Native Desktop Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      product-configured: ${{ steps.project.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Windows/Linux production builds: SKIPPED (no package.json).' >> "$GITHUB_STEP_SUMMARY"
          fi
  windows-build:
    needs: readiness
    if: needs.readiness.outputs.product-configured == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require frozen pnpm and Tauri configuration
        shell: bash
        run: test -f package.json && test -f pnpm-lock.yaml && test -f src-tauri/tauri.conf.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run frontend checks and tests
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test
      - name: Validate Tauri config and build Windows packages
        run: pnpm tauri build
  linux-build:
    needs: readiness
    if: needs.readiness.outputs.product-configured == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require frozen pnpm and Tauri configuration
        run: test -f package.json && test -f pnpm-lock.yaml && test -f src-tauri/tauri.conf.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Linux Tauri prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run frontend checks and tests
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test
      - name: Validate Tauri config and build Linux packages
        run: pnpm tauri build
