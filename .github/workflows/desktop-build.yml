name: Native Desktop Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/tauri.conf.json') != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build target-native packages
        run: pnpm tauri build
