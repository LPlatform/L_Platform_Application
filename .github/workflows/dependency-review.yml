name: Dependency Review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      dependencies-configured: ${{ steps.dependencies.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml || -f package-lock.json || -f Cargo.lock ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Dependency review: SKIPPED (no lockfiles).' >> "$GITHUB_STEP_SUMMARY"
          fi
  dependency-review:
    needs: readiness
    if: needs.readiness.outputs.dependencies-configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
