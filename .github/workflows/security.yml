name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '39 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    outputs:
      has-source: ${{ steps.source.outputs.available }}
      languages: ${{ steps.source.outputs.languages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: source
        shell: bash
        run: |
          languages=()
          if find src -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit 2>/dev/null | grep -q .; then
            languages+=(javascript-typescript)
          fi
          if find src-tauri -type f -name '*.rs' -print -quit 2>/dev/null | grep -q .; then
            languages+=(rust)
          fi
          if [[ ${#languages[@]} -gt 0 ]]; then
            joined=$(printf '%s,' "${languages[@]}")
            joined=${joined%,}
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "languages=$joined" >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'languages=' >> "$GITHUB_OUTPUT"
            echo 'CodeQL: SKIPPED (no React or Rust product source files).' >> "$GITHUB_STEP_SUMMARY"
          fi
  analyze:
    needs: source-readiness
    if: needs.source-readiness.outputs.has-source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ needs.source-readiness.outputs.languages }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
      - name: Retain CodeQL SARIF results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ github.sha }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 14
