name: Dependency Update Readiness
on:
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify dependency update configuration
        run: |
          test -f .github/dependabot.yml
          if [[ ! -f package.json || ! -f Cargo.toml ]]; then
            echo '::notice::Dependabot is configured weekly; npm and Cargo manifests are not yet present, so dependency PRs cannot be produced.'
            echo 'Dependency updates: awaiting manifests.' >> "$GITHUB_STEP_SUMMARY"
          fi
