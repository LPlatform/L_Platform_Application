name: Desktop Release
on:
  push:
    tags: ['app-v*.*.*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Verify tag and approved main ancestry
        shell: bash
        env: { TAG: '${{ github.ref_name }}' }
        run: |
          [[ "$TAG" =~ ^app-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG" origin/main
      - name: Require configured application
        run: |
          if [[ ! -f package.json || ! -f pnpm-lock.yaml || ! -f src-tauri/tauri.conf.json ]]; then
            echo 'Release blocked: pnpm project, frozen lockfile, and Tauri config are required.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: corepack enable && corepack prepare pnpm@11.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm tauri build
      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle -File | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash + '  ' + $_.Name } | Set-Content SHA256SUMS.txt
      - name: Generate SHA-256 checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: find src-tauri/target/release/bundle -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**
            SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: release-artifacts }
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ github.ref_name }}' }
        run: |
          mapfile -t assets < <(find release-artifacts -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
