name: Desktop Release
on:
  push:
    tags: ['app-v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Validate SemVer tag and main ancestry
        run: |
          [[ "$TAG" =~ ^app-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG" origin/main
      - name: Refuse an existing release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Require initialized desktop project
        shell: bash
        run: test -f package.json && test -f pnpm-lock.yaml && test -f src-tauri/tauri.conf.json
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - name: Run frontend quality and test gates
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test
      - name: Run Rust formatting, lint, and test gates
        run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace --all-targets
      - name: Build native installer
        run: pnpm tauri build
      - name: Verify Windows installers and write checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDirs = @('target/release/bundle', 'src-tauri/target/release/bundle') | Where-Object { Test-Path $_ }
          $files = $bundleDirs | ForEach-Object { Get-ChildItem -Path $_ -Include *.msi,*.exe -File -Recurse }
          if ($files.Count -eq 0) { throw 'No MSI or NSIS installer was produced.' }
          $lines = $files | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash + '  ' + $_.Name }
          $lines | Set-Content SHA256SUMS.txt
      - name: Verify Linux packages and write checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -f SHA256SUMS.txt
          for d in target/release/bundle src-tauri/target/release/bundle; do
            if [ -d "$d" ]; then
              find "$d" -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | xargs -0 -r sha256sum >> SHA256SUMS.txt
            fi
          done
          test -s SHA256SUMS.txt || { echo 'No Debian package or AppImage was produced.'; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/release/bundle/**
            src-tauri/target/release/bundle/**
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: release-artifacts }
      - name: Create release with installers, checksums, and generated notes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
          mapfile -t assets < <(find release-artifacts -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
